name: CI

on:
  push:
    branches: ["main", "entrega-intermediaria"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar lint (ruff)
        run: ruff check .

      - name: Rodar testes unitários (pytest)
        run: pytest tests/test_manager.py --tb=short -v

      - name: Rodar testes de integração (pytest)
        run: pytest tests/test_viacep_integration.py --tb=short -v
